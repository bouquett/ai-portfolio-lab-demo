<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 资产配置实验室 · Demo</title><style>
:root{--bg:#07111f;--card:#101d30;--line:#263a55;--text:#eef5ff;--muted:#9fb0c6;--blue:#69a7ff;--green:#50d6a0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#0d1b2d);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:36px 20px}h1{font-size:34px;margin:0 0 6px}.muted{color:var(--muted)}.notice{margin:22px 0;padding:12px 16px;border:1px solid #6a5525;background:#29230f;border-radius:10px;color:#ffe199}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(16,29,48,.92);border:1px solid var(--line);border-radius:14px;padding:18px}.metric b{display:block;font-size:25px;color:var(--green);margin-top:5px}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}canvas{width:100%;height:300px}label{display:flex;justify-content:space-between;margin:14px 0 4px}input{width:100%}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#06101e;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}td{padding:9px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}@media(max-width:760px){.grid,.two{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style></head><body><main><h1>📊 AI 资产配置实验室</h1><div class="muted">skfolio + DeepSeek · 静态交互演示</div><div class="notice">本页使用脱敏合成数据，不调用 API、不保存个人资料，也不构成投资建议。完整版本运行于私有本地环境。</div>
<section class="grid"><div class="card metric">模拟累计收益<b id="ret">8.42%</b></div><div class="card metric">模拟年化收益<b id="annual">2.73%</b></div><div class="card metric">模拟最大回撤<b id="dd">-1.36%</b></div><div class="card metric">模拟年化波动<b id="vol">1.92%</b></div></section>
<section class="two"><div class="card"><h2>组合净值 · 合成示例</h2><canvas id="chart" width="700" height="300"></canvas></div><div class="card"><h2>调整示例权重</h2><div id="controls"></div><button onclick="run()">重新生成模拟结果</button></div></section>
<section class="card" style="margin-top:16px"><h2>当前示例配置</h2><table id="table"></table><p class="muted">AI 在完整版本中只解释确定性计算结果，不负责生成收益数字。真实回测还会显示数据覆盖、再平衡频率、相关性及风险预算参考权重。</p></section>
</main><script>
const assets=[['超短债',36],['1–3年政金债',27],['3–5年国开债',21],['投资级信用债',16]];const controls=document.getElementById('controls');assets.forEach((a,i)=>controls.innerHTML+=`<label><span>${a[0]}</span><b id="v${i}">${a[1]}%</b></label><input id="r${i}" type="range" min="0" max="60" value="${a[1]}" oninput="document.getElementById('v${i}').textContent=this.value+'%'">`);
function run(){let w=assets.map((_,i)=>+document.getElementById('r'+i).value),sum=w.reduce((a,b)=>a+b,0)||1;w=w.map(x=>x/sum);document.getElementById('table').innerHTML=assets.map((a,i)=>`<tr><td>${a[0]}</td><td>${(w[i]*100).toFixed(1)}%</td></tr>`).join('');let risk=w.reduce((s,x,i)=>s+x*(i+1),0);let annual=1.7+risk*.55,vol=.8+risk*.55,dd=-(.45+risk*.35),total=(Math.pow(1+annual/100,3)-1)*100;ret.textContent=total.toFixed(2)+'%';document.getElementById('annual').textContent=annual.toFixed(2)+'%';document.getElementById('vol').textContent=vol.toFixed(2)+'%';document.getElementById('dd').textContent=dd.toFixed(2)+'%';draw(annual,vol)}
function draw(a,v){const c=document.getElementById('chart'),x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.strokeStyle='#263a55';for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,H*i/5);x.lineTo(W,H*i/5);x.stroke()}x.strokeStyle='#69a7ff';x.lineWidth=3;x.beginPath();let y=H*.82;for(let i=0;i<72;i++){y-=a*.09+(Math.sin(i*.7)+Math.sin(i*.19))*v*.07;x.lineTo(i*W/71,y)}x.stroke()}run();
</script></body></html>

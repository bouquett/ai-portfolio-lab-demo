name: Update real market data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-us-data.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/us; then
            echo "No market-data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us
          git commit -m "data: refresh real US market snapshot"
          git push
